    />
    <!-- Bright rim -->
    <path
        d="M 840 -40 C 650 110 566 320 574 510 C 582 710 720 900 980 1064"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="16"
        stroke-linecap="round"
    />
    <!-- Inner refraction line -->
    <path
        d="M 866 -40 C 684 112 604 322 612 510 C 620 700 748 880 1000 1044"
        fill="none"
        stroke="#F2B98C"
        stroke-opacity="0.35"
        stroke-width="6"
        stroke-linecap="round"
    />
</svg>
