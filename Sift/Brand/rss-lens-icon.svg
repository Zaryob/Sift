<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 800" width="780" height="800">
  <defs>
    <!-- Arka plan -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="0.55" stop-color="#fbeee2"/>
      <stop offset="1" stop-color="#f6e3d2"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Turuncu dolgular -->
    <linearGradient id="orangeOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5b86a"/>
      <stop offset="0.5" stop-color="#f0924c"/>
      <stop offset="1" stop-color="#e2643a"/>
    </linearGradient>
    <linearGradient id="orangeMid" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f4a855"/>
      <stop offset="0.55" stop-color="#eb7640"/>
      <stop offset="1" stop-color="#e05a48"/>
    </linearGradient>
    <linearGradient id="orangeDot" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ee8a4e"/>
      <stop offset="1" stop-color="#e0552e"/>
    </linearGradient>
    <linearGradient id="orangeSmall" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f0924a"/>
      <stop offset="1" stop-color="#df522e"/>
    </linearGradient>

    <!-- Mercek -->
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#fcefe3" stop-opacity="0.8"/>
      <stop offset="0.4" stop-color="#f7e0ca" stop-opacity="0.93"/>
      <stop offset="1" stop-color="#f9eadc" stop-opacity="0.97"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="0.3" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#f2c9a6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f2c9a6" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="tile">
      <rect x="18" y="42" width="714" height="712" rx="165"/>
    </clipPath>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#b98a66" flood-opacity="0.25"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="dotShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#d0643a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Karo -->
  <rect x="18" y="42" width="714" height="712" rx="165" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="18" y="42" width="714" height="712" rx="165" fill="url(#bgGlow)"/>

  <g clip-path="url(#tile)">
    <!-- Dış yay -->
    <path fill="url(#orangeOuter)" d="
      M112,161 Q112,135 138,135
      A505 505 0 0 1 553.3,394.4
      L462.4,445.0
      A401 401 0 0 0 138,239 Q112,239 112,213 Z"/>

    <!-- Orta yay -->
    <path fill="url(#orangeMid)" d="
      M112,345 Q112,319 138,319
      A321 321 0 0 1 432,614 Q433,640 407,640
      L353,640 Q328,640 328,614
      A217 217 0 0 0 138,423 Q112,423 112,397 Z"/>

    <!-- Tam daire (çeyrek daire yerine) -->
    <circle cx="169" cy="583" r="57" fill="url(#orangeSmall)"/>

    <!-- Mercek -->
    <path d="M590,40 C330,170 330,520 690,760 L760,760 L760,40 Z" fill="url(#lens)"/>
    <path d="M590,40 C330,170 330,520 690,760 L760,760 L760,40 Z" fill="url(#lensGlow)"/>
    <path d="M590,40 C330,170 330,520 690,760" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="18" filter="url(#soft)"/>
    <path d="M590,40 C330,170 330,520 690,760" fill="none" stroke="#ffffff" stroke-width="6"/>
  </g>

  <!-- Nokta -->
  <circle cx="508" cy="420" r="62" fill="#ffffff" opacity="0.55" filter="url(#soft)"/>
  <circle cx="508" cy="420" r="54" fill="#fff8f1"/>
  <circle cx="508" cy="420" r="47" fill="url(#orangeDot)" filter="url(#dotShadow)"/>

  <!-- Karo kenar parlaması -->
  <rect x="19.5" y="43.5" width="711" height="709" rx="164" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3"/>
</svg>
